<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d71920"><title>차량 운행기록</title><link rel="manifest" href="./manifest.json">
<style>
:root{--red:#d71920;--ink:#171717;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f7f8}*{box-sizing:border-box}body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.shell{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:20px}.badge{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.04)}h1{font-size:26px;margin:2px 0 8px}h2{font-size:18px;margin:0 0 14px}p{color:var(--muted);line-height:1.55}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}select,input{width:100%;padding:14px 13px;border:1px solid #d1d5db;border-radius:14px;background:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:15px;padding:15px;font-weight:900;font-size:16px;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#111;color:#fff}.ghost{background:#fff;border:1px solid var(--line)}
.status{padding:13px;border-radius:14px;background:#f3f4f6;font-size:14px;line-height:1.5}.status.live{background:#ecfdf3;color:#166534}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(12px)}nav .inner{max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr}nav button{padding:16px;border:0;background:transparent;font-weight:800}.activeTab{color:var(--red)}
.list{display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.mini{width:auto;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fff}.note{font-size:12px;color:var(--muted)}.danger{color:#b91c1c}
</style></head><body>
<div class="shell"><div class="top"><div><div class="brand">차량 운행기록</div><div id="facilityName" class="badge">시설 연결 전</div></div><div class="badge" id="apiState">DEMO</div></div>
<section id="userView"><div class="card"><h1>운행을 기록합니다</h1><p>차량과 운행자를 선택하면 현재 운행 상태를 확인합니다.</p><label>차량</label><select id="vehicle"></select><div id="vehicleStatus" class="status">차량을 선택해 주세요.</div></div>
<div id="startCard" class="card"><h2>운행 시작</h2><label>운행자</label><select id="driver"></select><label>동승자</label><select id="passenger" multiple size="3"></select><label>운행목적</label><select id="purpose"></select><label>행선지</label><input id="destination" placeholder="예: ○○구청"><label>출발 전 키로수(km)</label><input id="startKm" type="number" min="0" step="0.1" inputmode="decimal" placeholder="예: 42351"><button class="btn primary" id="startBtn">운행 시작</button></div>
<div id="endCard" class="card hidden"><h2>운행 종료</h2><div id="activeSummary" class="status live"></div><label>도착 키로수(km)</label><input id="endKm" type="number" min="0" step="0.1" inputmode="decimal"><button class="btn secondary" id="endBtn">운행 종료</button></div></section>
<section id="adminView" class="hidden"><div class="card"><h1>관리자</h1><p>이 시설에서 사용하는 기본 항목만 관리합니다.</p><label>시설명</label><input id="facilityNameAdmin" placeholder="시설명"><label>관리자 PIN</label><input id="adminPin" type="password" inputmode="numeric" placeholder="설정 저장 시 입력"><details style="margin-top:14px"><summary class="note">초기 연결 설정</summary><label>시트 API 주소</label><input id="apiUrl" placeholder="Apps Script 웹앱 URL"><button class="btn ghost" id="connectBtn">시설 데이터 불러오기</button><button class="btn ghost" id="copyUserLink" style="margin-top:8px">사용자용 링크 복사</button></details></div>
<div class="card"><h2>차량 목록</h2><div id="vehicleAdmin" class="list"></div><button class="mini" data-add="vehicles">+ 차량 추가</button></div><div class="card"><h2>사용자 목록</h2><div id="userAdmin" class="list"></div><button class="mini" data-add="users">+ 사용자 추가</button></div><div class="card"><h2>운행목적</h2><div id="purposeAdmin" class="list"></div><button class="mini" data-add="purposes">+ 목적 추가</button></div>
<div class="card"><h2>월간 차량운행일지</h2><p>차량과 월을 선택하면 기관 차량운행일지 양식으로 내려받습니다.</p><label>차량번호</label><select id="reportVehicle"></select><label>조회 월</label><input id="reportMonth" type="month"><button class="btn secondary" id="downloadReportBtn">운행일지 다운로드</button><p class="note">금일급유량·급유액·전표 항목은 현재 앱에서 수집하지 않으므로 빈칸으로 출력합니다.</p></div>
<button class="btn primary" id="saveAdminBtn">관리자 설정 저장</button><p class="note">열 순서를 바꿔도 됩니다. API는 열 위치가 아니라 헤더명으로 값을 찾습니다.</p></section></div>
<nav><div class="inner"><button id="userTab" class="activeTab">운행기록</button><button id="adminTab">관리자</button></div></nav><script src="./app.js"></script></body></html>
